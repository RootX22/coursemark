<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coursemark</title>
    <link rel="stylesheet" href="../lib/page.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="brand">
      <img src="../icons/32.png" alt="" />
      <strong>Coursemark</strong>
      <span id="plan" class="chip"></span>
    </header>
    <section id="stats"></section>
    <section>
      <h2 data-i18n="continueStudying"></h2>
      <ul id="courses" class="courses"></ul>
      <p id="empty" class="muted" data-i18n="emptyPopup" hidden></p>
    </section>
    <footer>
      <button id="library" type="button" data-i18n="openLibrary"></button>
      <a id="buy" class="button primary" target="_blank" rel="noopener" data-i18n="getPro" hidden></a>
    </footer>
  </body>
</html>
