<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coursemark</title>
    <link rel="icon" href="../icons/32.png" />
    <link rel="stylesheet" href="../lib/page.css" />
    <link rel="stylesheet" href="library.css" />
    <script type="module" src="library.js"></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="../icons/48.png" alt="" />
        <h1>Coursemark</h1>
        <span id="plan" class="chip"></span>
      </header>

      <section class="panel" id="pro"></section>

      <section class="panel">
        <h2 data-i18n="studyTime"></h2>
        <div id="stats"></div>
      </section>

      <section class="panel">
        <div class="row">
          <h2 data-i18n="courses"></h2>
          <div class="filters">
            <button type="button" data-filter="active" data-i18n="inProgress"></button>
            <button type="button" data-filter="finished" data-i18n="finished"></button>
          </div>
        </div>
        <ul id="courses" class="course-list"></ul>
        <p id="empty" class="muted" hidden></p>
      </section>

      <section class="panel">
        <h2 data-i18n="backup"></h2>
        <p class="muted" data-i18n="backupHelp"></p>
        <div class="row start">
          <button id="export" type="button" data-i18n="exportBackup"></button>
          <label class="button" id="import-label">
            <span data-i18n="importBackup"></span>
            <input id="import" type="file" accept=".json,application/json" hidden />
          </label>
        </div>
        <p id="backup-status" class="muted" role="status"></p>
      </section>
    </main>
  </body>
</html>
